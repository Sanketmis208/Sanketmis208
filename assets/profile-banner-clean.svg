<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sanket Mistry</title>
  <desc id="desc">Sanket Mistry - full-stack and Flutter engineer, product-minded builder, and AI and systems explorer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B1A"/>
      <stop offset="0.48" stop-color="#171A3C"/>
      <stop offset="1" stop-color="#162E4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#35D3C7"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#35D3C7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#35D3C7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1060" cy="72" r="265" fill="url(#glowA)"/>
  <circle cx="130" cy="335" r="255" fill="url(#glowB)"/>

  <g opacity="0.9">
    <circle cx="1015" cy="108" r="58" fill="none" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="1015" cy="108" r="86" fill="none" stroke="#35D3C7" stroke-opacity="0.22" stroke-width="1"/>
    <path d="M949 255h128M971 279h84M990 303h46" stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="8" stroke-linecap="round"/>
    <path d="M966 82l-28 26 28 26M1064 82l28 26-28 26M1028 72l-25 72" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="58" width="92" height="10" rx="5" fill="url(#accent)"/>
    <text x="72" y="150" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-1">Sanket Mistry</text>
    <text x="76" y="201" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" letter-spacing="0.2">Full-Stack &amp; Flutter Engineer</text>
    <text x="76" y="244" fill="#8FA4C7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="0.8">PRODUCT-MINDED BUILDER  •  AI &amp; SYSTEMS EXPLORER</text>
  </g>

</svg>
